<form action="https://merchant.webmoney.ru/lmi/payment.asp" method="POST">
    <!-- Պատվերի գումար -->
    <input type="hidden" name="LMI_PAYMENT_AMOUNT" value="{{ order.total }}">

    <!-- Պատվերի նկարագրություն (օրինակ՝ պատվերի համարը) -->
    <input type="hidden" name="LMI_PAYMENT_DESC" value="Order #{{ order.id }}">

    <!-- Պատվերի համարը -->
    <input type="hidden" name="LMI_PAYMENT_NO" value="{{ order.id }}">

    <!-- Ձեր WebMoney դրամապանակի ID -->
    <input type="hidden" name="LMI_PAYEE_PURSE" value="Z123456789012"> <!-- Պետք է փոխարինեք ձեր WebMoney դրամապանակի ID-ով -->

    <!-- Վճարման արդյունքի URL -->
    <input type="hidden" name="LMI_RESULT_URL" value="https://yourdomain.com/payment/webmoney/result/">

    <!-- Հաջող վճարման URL -->
    <input type="hidden" name="LMI_SUCCESS_URL" value="https://yourdomain.com/payment/success/">

    <!-- Չհաջողված վճարման URL -->
    <input type="hidden" name="LMI_FAIL_URL" value="https://yourdomain.com/payment/fail/">

    <button type="submit">Վճարել WebMoney-ով</button>
</form>
