<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <title>Thank You for Signing Up!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e4f5);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }

    .container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #2b6cb0;
      margin-bottom: 20px;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    a.verify-link {
      display: inline-block;
      padding: 12px 25px;
      background-color: #2b6cb0;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    a.verify-link:hover {
      background-color: #225a9e;
    }

    .raw-link {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thank You for Signing Up!</h1>
    <p>Please verify your email address by clicking the button below:</p>
    <a class="verify-link" href="http://localhost:3000/signup/verify/?code={{ code }}">
      Verify Email
    </a>
    <p class="raw-link">
      Or copy this link: <br>
      http://localhost:3000/signup/verify/?code={{ code }}
    </p>
  </div>
</body>
</html>
