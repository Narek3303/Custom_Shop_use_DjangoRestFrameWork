<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      color: #111827;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      color: #1f2937;
      font-size: 24px;
      margin-bottom: 20px;
    }

    p {
      font-size: 16px;
      color: #4b5563;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 24px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .link-text {
      word-break: break-word;
      font-size: 14px;
      color: #6b7280;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      h1 {
        font-size: 20px;
      }

      .btn {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Your Password</h1>
    <p>
      You recently requested to reset your password. Click the button below to choose a new one.
    </p>
    <a
      href="http://localhost:3000/password/reset/verify/?code={{ code }}"
      class="btn"
      target="_blank"
    >
      Reset Password
    </a>
    <p class="link-text">
      Or copy and paste this link into your browser:<br />
      <a href="http://localhost:3000/password/reset/verify/?code={{ code }}">
        http://localhost:3000/password/reset/verify/?code={{ code }}
      </a>
    </p>
  </div>
</body>
</html>
